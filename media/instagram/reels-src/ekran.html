<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Onest:wght@500;600;700;800&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#05060F}
#st{position:absolute;inset:0;overflow:hidden;perspective:2200px;perspective-origin:540px 900px;font-family:Onest,'Noto Sans KR',sans-serif;color:#EEF0FF}
.abs{position:absolute;left:0;top:0;transform-style:preserve-3d;will-change:transform}
.bgglow{position:absolute;inset:-20%;background:radial-gradient(60% 40% at 50% 46%,rgba(155,92,255,.55),rgba(43,30,120,.25) 45%,rgba(5,6,15,0) 75%)}
.phone{width:560px;height:1212px;border-radius:84px;background:#0b0b14;padding:18px;box-shadow:0 0 0 3px #2a2a44,0 40px 140px rgba(155,92,255,.55)}
.phone .scr{width:100%;height:100%;border-radius:68px;overflow:hidden;position:relative;background:#f3f1fb}
.phone .scr img{width:100%;position:absolute;left:0;top:0}
.phone .notch{position:absolute;left:50%;top:34px;width:150px;height:40px;margin-left:-75px;border-radius:20px;background:#0b0b14;z-index:3}
.card{width:470px;height:1017px;border-radius:44px;overflow:hidden;box-shadow:0 30px 100px rgba(0,0,0,.6),0 0 60px rgba(155,92,255,.35)}
.card img{width:100%}
.cap{font-family:Unbounded,'Noto Sans KR';font-weight:800;text-align:center;white-space:nowrap}
.pill{border-radius:999px;padding:26px 46px;font-weight:800;font-size:46px;white-space:nowrap;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.word{font-family:Unbounded,'Noto Sans KR';font-weight:900;font-size:150px;line-height:1;white-space:nowrap;letter-spacing:-4px}
.hl{background:#EEF0FF;color:#05060F;padding:6px 26px 18px}
.ring{border-radius:50%;border:6px solid rgba(180,156,255,.9);box-shadow:0 0 40px rgba(155,92,255,.8),inset 0 0 40px rgba(155,92,255,.6)}
.hdr{left:0;width:1080px;top:200px;text-align:center;font-weight:600;font-size:38px;color:rgba(238,240,255,.85)}
</style></head><body>
<div id="st"></div>
<script>
/* «EKRAN ICHIGA» — 3D telefon va ilovaning haqiqiy ekranlari. 25 s, 96 BPM, takt 2.5 s. Hamma narsa seek(t) da. */
const APP = new URLSearchParams(location.search).get('app') || 'voila';
const K = {
  voila: { name: 'Voilà!', url: 'voila-fr.up.railway.app', header: "Voilà! · fransuz tili", ai: 'Vivi', tag: "Fransuz tili — o'yin kabi", verbs: ['tinglaydi', 'gapiradi', 'tuzatadi'], levels: 'A1 → C2',
    caps: ['Darslar xaritasi', 'Vivi AI ustoz', 'Mashq', 'Turnir va liga', "Do'kon"], prices: [['1 hafta', '39 000'], ['1 oy', '69 000'], ['3 oy', '139 000']] },
  gotopic: { name: 'Go Topic', url: 'gotopic.up.railway.app', header: 'Go Topic · koreys tili', ai: 'Hori', tag: "Koreys tili — o'yin kabi", verbs: ['tinglaydi', 'gapiradi', 'tuzatadi'], levels: 'Hangul → TOPIK 6',
    caps: ['Darslar xaritasi', 'Hori AI ustoz', "Lug'at · 30 000", 'Turnir va liga', "Do'kon"], prices: [['1 hafta', '39 000'], ['1 oy', '69 000'], ['3 oy', '139 000']] },
}[APP];
const V = '#9B5CFF', VL = '#B49CFF', PK = '#FF6B9A', PL = '#FF8FD0', CY = '#7FE3FF', GD = '#FFD23F', WH = '#EEF0FF', INK = '#1A1640';
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, x) => a + (b - a) * x;
const N10 = 1 - Math.pow(2, -10), expo = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : (1 - Math.pow(2, -10 * x)) / N10);
const eio = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? (1 - expo(1 - 2 * x)) / 2 : (1 + expo(2 * x - 1)) / 2);
const ex = (t, a, d) => expo((t - a) / d), io = (t, a, d) => eio((t - a) / d);
const BAR = 2.5;
const st = document.getElementById('st');
const el = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); const n = d.firstChild; st.appendChild(n); return n; };
const img = (n) => `img/${APP}-${n}.png`;
const set = (n, o, tf, extra = {}) => { n.style.opacity = o; n.style.display = o <= 0.001 ? 'none' : 'block'; n.style.transform = tf; Object.assign(n.style, extra); };

// --- elementlar ---
const bg = el('<div class="bgglow"></div>');
const floor = el('<div class="abs" style="width:1400px;height:1400px;border-radius:50%;background:radial-gradient(closest-side,rgba(155,92,255,.35),rgba(155,92,255,0))"></div>');
const SCR = ['welcome', 'map', 'tutor', 'league', 'shop'];
const phone = el(`<div class="abs phone"><div class="scr"><div class="notch"></div>${SCR.map((n) => `<img data-n="${n}" src="img/${APP}-${n}.png">`).join('')}</div></div>`);
const cards = ['map', 'tutor', 'practice', 'league', 'shop'].map((n) => el(`<div class="abs card"><img src="${img(n)}"></div>`));
const caps = K.caps.map((c) => el(`<div class="abs cap" style="font-size:56px;width:1080px">${c}</div>`));
const rings = [0, 1, 2, 3, 4].map((i) => el(`<div class="abs ring" style="width:${300 + i * 150}px;height:${300 + i * 150}px"></div>`));
const icon = el(`<div class="abs" style="width:340px;height:340px;border-radius:76px;overflow:hidden;box-shadow:0 0 120px rgba(155,92,255,.9)"><img src="img/icon-${APP}.png" style="width:100%"></div>`);
const words = [K.ai, ...K.verbs].map((w, i) => el(`<div class="abs word ${i === 2 ? 'hl' : ''}" style="${i === 1 ? `color:${CY};text-shadow:0 0 40px rgba(127,227,255,.8)` : i === 3 ? `color:${PL};text-shadow:0 0 40px rgba(255,143,208,.8)` : ''}">${w}</div>`));
const lvl = el(`<div class="abs word" style="font-size:118px;background:linear-gradient(90deg,${CY},${VL},${PL});-webkit-background-clip:text;color:transparent">${K.levels}</div>`);
const prices = K.prices.map(([a, b], i) => el(`<div class="abs pill" style="background:${i === 1 ? `linear-gradient(90deg,${V},${PK})` : '#EEF0FF'};color:${i === 1 ? '#fff' : INK}">${a} · <b>${b}</b> so'm</div>`));
const cursor = el(`<div class="abs" style="width:70px;height:96px"><svg width="70" height="96" viewBox="0 0 60 90"><path d="M2 2 L2 76 L21 58 L35 88 L48 82 L34 53 L59 53 Z" fill="#EEF0FF" stroke="#1A1640" stroke-width="4" stroke-linejoin="round"/></svg></div>`);
const tap = el('<div class="abs" style="width:200px;height:200px;border-radius:50%;border:6px solid #EEF0FF"></div>');
const title = el(`<div class="abs cap" style="font-size:120px;width:1080px;background:linear-gradient(90deg,${CY},${VL},${PL});-webkit-background-clip:text;color:transparent">${K.name}</div>`);
const url = el(`<div class="abs" style="width:1080px;text-align:center;font-size:46px;font-weight:600">${K.url}</div>`);
const free = el(`<div class="abs" style="width:1080px;text-align:center;font-size:44px;font-weight:800;color:${GD}">🎁 Darslar bepul</div>`);
const hdr = el(`<div class="abs hdr">${K.header}</div>`);
const capTop = el('<div class="abs cap" style="font-size:64px;width:1080px"></div>');

const P = (x, y, z = 0) => `translate3d(${x}px,${y}px,${z}px)`;
function frame(t) {
  const b = Math.floor(t / BAR), lt = t - b * BAR;
  // fon nafas oladi
  set(bg, 1, `scale(${1 + .06 * Math.sin(t * 1.3)})`);
  [floor, phone, ...cards, ...caps, ...rings, icon, ...words, lvl, ...prices, cursor, tap, title, url, free, capTop].forEach((n) => set(n, 0, ''));
  const PW = 560, PH = 1212, pcx = 540 - PW / 2, pcy = 920 - PH / 2;
  const showPhone = (src, tf, o = 1) => { phone.querySelectorAll('img').forEach((im) => (im.style.display = src.endsWith(im.dataset.n + '.png') ? 'block' : 'none')); set(phone, o, P(pcx, pcy) + tf); };
  const caption = (txt, k, y = 1600) => { capTop.textContent = txt; set(capTop, cl(k * 2), P(0, y + (1 - expo(k)) * 70)); };
  if (b === 0) { // telefon qorong'ilikdan aylanib chiqadi
    const k = ex(lt, 0, 1.6), r = lerp(-540, 0, io(lt, 0, 2.1));
    set(floor, .9 * k, P(-160, 1250) + ' rotateX(80deg)');
    showPhone(img('welcome'), ` scale(${lerp(.35, 1, k)}) rotateY(${r}deg) rotateX(${lerp(20, 6, k)}deg)`, cl(lt * 3));
    caption(K.tag, (lt - 1.2) / .5);
  } else if (b === 1) { // kamera ekranga sho'ng'iydi
    const k = io(lt, 0, 1.4), s = lerp(1, 1.9, k);
    showPhone(img('map'), ` rotateX(${lerp(6, 48, k)}deg) rotateZ(${lerp(0, -12, k)}deg) scale(${s}) translate3d(0,${lerp(0, 120, k)}px,0)`);
    const out = io(lt, 1.9, .6); if (out > 0) set(phone, 1 - out, P(pcx, pcy) + ` rotateX(48deg) rotateZ(-12deg) scale(${1.9 + out * 2})`);
    caption(K.caps[0], (lt - .3) / .5, 300);
  } else if (b === 2 || b === 3) { // ekranlar 3D karuselda aylanadi
    const u = (t - BAR * 2) / (BAR * 2), rot = lerp(70, -250, eio(u * 1.05));
    cards.forEach((c, i) => {
      const a = (rot + i * 72) * Math.PI / 180, x = Math.sin(a) * 620, z = Math.cos(a) * 620 - 620;
      set(c, cl((t - BAR * 2) * 3 - i * .2), P(540 - 235 + x, 920 - 508, z) + ` rotateY(${rot + i * 72}deg)`);
    });
    const front = cards.map((_, i) => Math.cos((rot + i * 72) * Math.PI / 180)).reduce((m, v, i, a) => (v > a[m] ? i : m), 0);
    caption(K.caps[front], 1, 1580);
  } else if (b === 4) { // porlayotgan disk ustida ikonka
    const k = ex(lt, 0, .8);
    rings.forEach((r, i) => { const s = 300 + i * 150; set(r, k * (1 - i * .15), P(540 - s / 2, 1080 - s / 2) + ` rotateX(72deg) rotateZ(${t * 40 * (i % 2 ? -1 : 1)}deg) scale(${lerp(.3, 1, ex(lt, i * .08, .7))})`); });
    set(icon, 1, P(370, lerp(1300, 760, k)) + ` rotateY(${Math.sin(t * 2) * 18}deg) rotateX(10deg)`);
    caption(`${K.ai} AI ustoz`, (lt - .5) / .5, 1500);
  } else if (b === 5) { // kinetik matn: so'zlar bir-birini itaradi
    words.forEach((w, i) => {
      const at = i * .55, k = ex(lt, at, .45), stack = [0, 1, 2, 3].filter((j) => lt > j * .55).length - 1 - i;
      const rot = i === 1 ? lerp(-90, 0, k) : i === 3 ? lerp(25, -4, k) : 0;
      set(w, cl(k * 3) * (stack > 2 ? 0 : 1), P(i % 2 ? 130 : 90, 820 - stack * 180 * ex(lt, (i + 1) * .55, .4) + (1 - k) * 220) + ` rotate(${rot}deg) scale(${lerp(1.6, 1, k)})`);
    });
  } else if (b === 6) { // AI ekran + kursor «Super olish»ni bosadi
    const k = ex(lt, 0, .7); showPhone(img('tutor'), ` rotateY(${lerp(-35, -12, k)}deg) rotateX(4deg) scale(${lerp(.7, 1, k)})`);
    const cx = lerp(1100, 560, io(lt, .8, .6)), cy = lerp(1700, 1460, io(lt, .8, .6)); set(cursor, cl((lt - .7) * 4), P(cx, cy));
    const p = lt > 1.5 ? cl((lt - 1.5) / .4) : 0; if (p > 0 && p < 1) set(tap, 1 - p, P(cx - 100, cy - 100) + ` scale(${.2 + p})`);
    caption(`${K.ai} AI — 24/7`, (lt - .4) / .5, 300);
  } else if (b === 7) { // halqalar tunneli → liga ekrani
    const k = io(lt, 0, 1.3);
    rings.forEach((r, i) => { const s = 300 + i * 150; set(r, 1 - k * .7, P(540 - s / 2, 920 - s / 2, lerp(-1600, 600, cl(k + i * .12))) + ` rotateX(${t * 70 + i * 30}deg) rotateY(${t * 50 + i * 20}deg)`); });
    showPhone(img('league'), ` scale(${lerp(.2, .95, io(lt, .9, .9))}) rotateY(${lerp(180, 12, io(lt, .9, .9))}deg)`, cl((lt - .9) * 3));
    caption(K.levels, (lt - 1.2) / .5, 300);
  } else if (b === 8) { // do'kon: narxlar ekrandan chiqib suzadi
    showPhone(img('shop'), ` rotateY(14deg) rotateX(4deg) scale(.92) translate3d(-150px,0,0)`);
    prices.forEach((pr, i) => { const k = ex(lt, .3 + i * .25, .6); set(pr, cl(k * 2), P(lerp(260, 400, k), 640 + i * 230, lerp(-400, 260, k)) + ` rotateY(-18deg)`); });
    caption("Super — 69 000 so'm/oy", (lt - .4) / .5, 1660);
  } else { // yakun: ikonka, nom, havola
    const k = ex(lt, 0, .7);
    rings.forEach((r, i) => { const s = 300 + i * 150; set(r, k * (.8 - i * .14), P(540 - s / 2, 760 - s / 2) + ` scale(${lerp(.4, 1, ex(lt, i * .07, .8))}) rotate(${t * 30}deg)`); });
    set(icon, 1, P(370, 590) + ` scale(${lerp(.3, 1, k)}) rotateY(${lerp(-180, 0, k)}deg)`);
    set(title, cl((lt - .4) * 3), P(0, 1040 + (1 - ex(lt, .4, .5)) * 80));
    set(url, cl((lt - .7) * 3), P(0, 1220 + (1 - ex(lt, .7, .5)) * 60));
    set(free, cl((lt - .95) * 3), P(0, 1310 + (1 - ex(lt, .95, .5)) * 60));
  }
  // sahnalar orasida: oq chaqnash o'rniga yorug' nuqtaga yig'ilish (har takt oxirida 0.3 s)
  const out = b < 9 && b !== 2 ? io(lt, BAR - .32, .32) : 0;
  st.style.transform = out > 0 ? `scale(${1 - .9 * out})` : `scale(${1 + .02 * (lt / BAR)})`;
  st.style.transformOrigin = '540px 920px';
  st.style.filter = out > 0 ? `blur(${out * 10}px)` : 'none';
  set(hdr, 1, P(0, 0));
}
window.seek = (t) => frame(Math.max(0, Math.min(24.999, t)));
window.DUR = 25;
window.ready = (async () => {
  for (const f of ['800 40px Unbounded', '900 40px Unbounded', '600 40px Onest', '800 40px Onest', '900 40px "Noto Sans KR"']) await document.fonts.load(f, "AaÀ한→·'");
  await Promise.all([...document.images].map((i) => i.decode().catch(() => 0)));
  for (const n of ['welcome', 'map', 'tutor', 'league', 'shop']) { const im = new Image(); im.src = img(n); await im.decode().catch(() => 0); }
  seek(0);
})();
</script></body></html>
