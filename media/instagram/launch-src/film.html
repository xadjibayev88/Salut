/* ---------- liquid glass: istalgan shakl (harf, tomchi, toolbar, linza, shar, raqamlar) ---------- */
function glass(draw, o = {}) {

];

const CLICKS = [B(6), B(12), B(17), B(30), B(36), B(37), B(38)];
function drawCursor(t) {

/* ---------- so'z belgisi (akkordeon) ---------- */

  ctx.save(); ctx.font = `800 ${WMS}px ${WM}`; ctx.fontStretch = 'expanded'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = INK;
  const end = ctx.measureText(K.end).width, wd = ctx.measureText(K.wm).width, x0 = CX - (wd + end) / 2, dotX = x0 + wd; let x = x0; const kk = cl(1 - sq, .001, 1.1);

/* ---------- bento va to'r ---------- */
const TS = 300, GAP = 20;

/* ---------- har zarbdagi sahna ---------- */

function sOpen(t) {

    txt(ctx, '☀ Kunduz', 130, 1520, 34, '#fff', { align: 'left' }); txt(ctx, 'Oltin soat ☀', 950, 1520, 34, '#fff', { align: 'right' });
